# Configuración del proyecto Supabase (CLI >= 2.x)
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "somos-brasil"

[api]
enabled = true
port = 54321
# Solo "public". La app no usa GraphQL: dejarlo exposed suma una superficie HTTP
# completa (con introspeccion, que devuelve el mapa del schema) sin ningún uso.
# La migracion 0016 revoca tambien USAGE sobre graphql_public, asi que el permiso
# real esta cerrado por SQL y no solo por esta config.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324
users = []

[storage]
enabled = false
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

# La app no usa auth.users (decisión D1): el "usuario actual" es un usuario de la
# tabla public.users elegido en el cliente. Las edge functions se llaman con la
# anon key y sin sesión de usuario, por eso verify_jwt = false.
[functions.calculate-trip-summary]
verify_jwt = false

[functions.get-leaderboard]
verify_jwt = false

[functions.add-to-itinerary]
verify_jwt = false

# Sesión con PIN del grupo: valida {user_id, pin} y emite un JWT custom HS256.
[functions.login]
verify_jwt = false

# Toda escritura pasa por acá (service role + validación + rate limit + identidad del JWT).
[functions.member-actions]
verify_jwt = false
